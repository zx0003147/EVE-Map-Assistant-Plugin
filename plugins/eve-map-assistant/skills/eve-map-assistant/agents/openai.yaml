interface:
  display_name: "EVE Map Assistant"
  short_description: "Plan EVE routes and authorized map markers"
  default_prompt: "Use $eve-map-assistant to plan a route or safely mark an EVE system."

dependencies:
  tools:
    - type: "mcp"
      value: "eve-static-map"
      description: "EVE Static Map Planner's Plugin-bundled localhost MCP integration"

policy:
  allow_implicit_invocation: true
