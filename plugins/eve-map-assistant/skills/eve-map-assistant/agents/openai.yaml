interface:
  display_name: "EVE Map Assistant"
  short_description: "Find systems and safely plan or inspect EVE routes"
  default_prompt: "Use $eve-map-assistant to find Jita or plan an EVE route in natural language."

dependencies:
  tools:
    - type: "mcp"
      value: "eve-static-map"
      description: "EVE Static Map Planner's Plugin-configured localhost HTTP MCP integration"

policy:
  allow_implicit_invocation: true
